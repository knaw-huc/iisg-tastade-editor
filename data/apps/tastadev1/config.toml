
[app]
name="tastadev1"
title="Tastade Editor version 1"
def_prof="clarin.eu:cr1:p_1758888743558"
cmdi_version="1.2"

[app.access]
#users="./htp.test" # location of the htpassword file, i.e. the "users" and "owner"
read="any" # or "users" or "owner"
write="any" # or "users" or "owner"

######################################## PERSON OBSERVATIONS  ########################################
[app.prof.personObservation]
prof="clarin.eu:cr1:p_1758888743558"
title="string(/cmd:CMD/cmd:Components/cmdp:PersonObservation/cmdp:PersonNameObservation/cmdp:NameAsObserved/(cmdp:name[@xml:lang='en'],cmdp:name)[1])"

[app.prof.personObservation.list]
        
#[app.prof.personObservation.list.label]
#xpath="string((/cmd:CMD/cmd:Components//cmdp:*[empty(cmdp:*)][normalize-space(text())!=''])[1])"
#label="Label"
#sort="true"# or "false"
#filter="true"# or "'select'"

[app.prof.personObservation.list.nr]
xpath="replace(//*:MdSelfLink,'unl://','')"
label="record-nr"
sort="true"
filter="true"


