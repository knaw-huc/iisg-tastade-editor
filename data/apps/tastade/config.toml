
[app]
name="tastadev1"
title="Tastade Editor version 2"
def_prof="clarin.eu:cr1:p_1784045962450"
cmdi_version="1.2"

[app.access]
#users="./htp.test" # location of the htpassword file, i.e. the "users" and "owner"
read="any" # or "users" or "owner"
write="users" # or "any" or "owner"

######################################## SOURCES  ########################################
[app.prof.source]
prof="clarin.eu:cr1:p_1784045962450"
title="string(/cmd:CMD/cmd:Components/cmdp:Source/cmdp:SourceBasicMetadata/cmdp:nameOrTitle)"

[app.prof.source.list]

[app.prof.source.list.nr]
xpath="replace(//*:MdSelfLink,'unl://','')"
label="record-nr"
sort="true"
filter="true"

[app.prof.source.list.keytitle]
xpath="string(/cmd:CMD/cmd:Components/cmdp:Source/cmdp:SourceBasicMetadata/cmdp:nameOrTitle)"
label="Key title"
sort="true"# or "false"
filter="'select'"# or "true"

[app.prof.source.list.status]
xpath="string(/cmd:CMD/cmd:Components/cmdp:Source/cmdp:RecordWorkflowStatus/cmdp:recordStatus)"
label="Work status"
sort="true"# or "false"
filter="'select'"# or "true"

[app.prof.source.list.creator]
xpath="string(//*:MdCreator)"
label="Creator"
sort="true"
filter="true"

########################################## ACTOR OBSERVATIONS  ########################################

[app.prof.actorObservation]
prof="clarin.eu:cr1:p_1772521921743"
title="string((/cmd:CMD/cmd:Components/cmdp:Actor/cmdp:LabelObserved/cmdp:labelAsWritten)"

[app.prof.actorObservation.list]

[app.prof.actorObservation.list.nr]
xpath="replace(//*:MdSelfLink,'unl://','')"
label="record-nr"
sort="true"
filter="true"
#
[app.prof.actorObservation.list.status]
xpath="string(/cmd:CMD/cmd:Components/cmdp:Actor/cmdp:RecordWorkflowStatus/cmdp:recordStatus)"
label="Work status"
sort="true"# or "false"
filter="'select'"# or "true"

